<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
    <div class="rose-background">
        <div class="container">
            <img class="product" src="./images/image-product-desktop.jpg" />
            <div class="other_part">
                <h3 class="margin-left"> Perfume</h3>
                <h2 class="margin-left"> Gabrielle Essence Eau De Parfum</h2>

                <p class="margin-left">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="price-related">
                    <h2 class="price"> $149.99</h2>
                    <p class="old-price"> $169.99</p>
                </div>

                <button><img class="image-button" src="./images/icon-cart.svg"  /> <p class="text-button">Add to Cart</p></button>
            </div>

        </div>
    </div>
   

  
  
</body>
</html>
